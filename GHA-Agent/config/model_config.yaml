platforms:
  default:
    provider: openai
    timeout_seconds: 600
    max_retries: 2

timestamp_segmenter:
  k_value: 3
  window_size: 50

log_range_processor:
  max_line_length: 10000
  keep_length: 29

preprocessing_agent:
  keywords_path: "resources/keywords.json"

classification_agent:
  model: "gpt-5.4"
  platform: "default"
  reasoning_effort: "low"
  verbosity: "low"
  initial_read_lines: 10
  max_additional_reads: 3
  enable_function_calling: true
  max_tool_iterations: 10

judgment_agents:
  count: 1
  agent_1:
    model: "gpt-5.4"
    platform: "default"
    reasoning_effort: "low"
    verbosity: "low"

early_termination_agents:
  count: 1
  consecutive_no_error_threshold: 6
  hard_consecutive_no_error_cutoff: 10
  judgment_agent_1:
    model: "gpt-5.4"
    platform: "default"
    reasoning_effort: "low"
    verbosity: "low"

sliding_window_agent:
  model: "gpt-5.4"
  platform: "default"
  reasoning_effort: "low"
  verbosity: "low"
  window_size: 300
  overlap_ratio: 0.1
  max_windows: 10000

extraction_agents:
  count: 1
  pruning_agent_1:
    model: "gpt-5.4"
    platform: "default"
    reasoning_effort: "low"
    verbosity: "medium"

sliding_window_extraction_agents:
  max_forward_expansion: 1
  max_backward_expansion: 3
  max_view_previous: 10
  agent_1:
    model: "gpt-5.4"
    platform: "default"
    reasoning_effort: "low"
    verbosity: "low"

pruning_pipeline:
  large_block_fast_path:
    max_llm_windows: 20
    max_llm_block_lines: 5000

  anchor_finder:
    min_anchors_threshold: 3

  protector:
    k_before: 20
    k_after: 50
    soft_window: 20

  safe_pruner:
    min_distance_from_anchor: 20
    max_consecutive_duplicates: 3

  prune_proposer:
    model: "gpt-5.4"
    platform: "default"
    reasoning_effort: "low"
    verbosity: "low"
    max_candidate_lines: 300

  prune_critic:
    model: "gpt-5.4"
    platform: "default"
    reasoning_effort: "low"
    verbosity: "low"
    validation_mode: "evidence"

server:
  host: "0.0.0.0"
  port: 8000
  debug: false
